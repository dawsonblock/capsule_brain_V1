[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capsule-brain"
version = "2.16.0"
description = "Capsule Brain v2 — async service runtime for an autonomous AI assistant"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
tracing = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]
semantic = ["sqlite-vec>=0.1.6"]
gui = ["qasync>=0.27", "PyQt5>=5.15"]
dev = [
    "redis>=5.0",
    "qasync>=0.27",
    "PyQt5>=5.15",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
