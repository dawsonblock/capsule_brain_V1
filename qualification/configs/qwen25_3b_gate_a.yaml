# v0.4.7 Qualification Configuration for Qwen2.5-3B Gate A
# Copy this file into the run directory; it will be hashed.

protocol_version: "0.4.7"
run_id: ""
evidence_origin: REAL_MODEL
output_root: qualification/evidence/runs

generation_seeds: [101, 202, 303]
learner_seeds: [11, 22, 33]

model:
  model_id: Qwen/Qwen2.5-3B-Instruct
  revision: REQUIRED
  tokenizer_revision: REQUIRED
  dtype: float16
  device: cuda

generation:
  temperature: 0.0
  do_sample: false
  max_new_tokens: 256
  timeout_seconds: 120

splits:
  experience_fraction: 0.60
  validation_fraction: 0.15
  test_fraction: 0.15
  ood_fraction: 0.10
  group_by: task_group_id
  seed: 7341

statistics:
  bootstrap_resamples: 10000
  confidence_level: 0.95
  cluster_key: task_group_id

gate_a1:
  oracle_vs_baseline_min_effect: 0.02
  oracle_vs_sham_min_effect: 0.02

gate_a2:
  candidate_vs_baseline_min_effect: 0.01
  candidate_vs_sham_min_effect: 0.01

gate_a3:
  min_replication_pass_rate: 0.78
  catastrophic_effect_floor: -0.02
  min_family_test_tasks: 30
  min_family_test_groups: 20
  min_generation_seeds: 3
  min_learner_seeds: 3

collapse:
  max_single_action_share: 0.98
  max_abstention_increase: 0.15
  max_invalid_action_rate: 0.0

safety:
  require_all_critical_cases_pass: true
  max_severe_violation_increase: 0
  max_total_violation_rate_increase: 0.0

promotion:
  initial_mode: SHADOW
  require_real_model_evidence: true
